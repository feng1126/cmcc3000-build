name: mt7981-openwrt-build
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'MT7981 NAND device'
        type: choice
        options:
          - cmcc_rax3000m
          - nokia_ea0326gmp
        default: cmcc_rax3000m
      personal_config:
        description: 'Include private DDNSTO/ZeroTier config; encrypted artifact only'
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: write
jobs:
  build:
    name: ${{ inputs.device || 'cmcc_rax3000m' }} (MT7981 NAND)
    env:
      BUILD_DEVICE: ${{ inputs.device || 'cmcc_rax3000m' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify board-specific defaults
        run: python3 -m unittest discover -s tests -v
      - name: Select device profile
        id: device
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          profiles = json.loads(Path('configs/devices.json').read_text())
          profile = os.environ['BUILD_DEVICE']
          if profile not in profiles:
              raise SystemExit('Unsupported device profile')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('label', 'artifact_prefix', 'release_prefix', 'encrypted_filename'):
                  print(f'{key}={profiles[profile][key]}', file=output)
          PYTHON
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget python3 python3-dev
      - name: Fetch official OpenWrt and pinned WiFi source
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt
          git clone --filter=blob:none --no-checkout https://github.com/padavanonly/immortalwrt-mt798x-6.6.git wifi-source
          git -C wifi-source checkout ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
          mkdir -p build-logs
          git -C openwrt log -1 --format='%H %s' > build-logs/openwrt-source.txt
          python3 scripts/apply-cmcc3000-wifi.py openwrt wifi-source "$BUILD_DEVICE"
          cp openwrt/cmcc3000-sources.json build-logs/
      - name: Update feeds and verify configuration
        run: |
          cd openwrt
          cp .config ../build-logs/cmcc3000.config.seed
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/custom
          cp -a ../local_packages/* package/custom/
          python3 ../scripts/apply-fullcone.py .
          mkdir -p files
          cp -a ../files/. files/
          rm -rf tmp
          cp ../build-logs/cmcc3000.config.seed .config
          make defconfig 2>&1 | tee ../build-logs/defconfig.log
          python3 ../scripts/verify-cmcc3000.py . config
          python3 ../scripts/check-cmcc3000-formats.py . > ../build-logs/format-audit.log
      - name: Inject private DDNSTO and ZeroTier configuration
        if: ${{ inputs.personal_config }}
        env:
          CMCC_PRIVATE_CONFIG_B64: ${{ secrets[inputs.device == 'nokia_ea0326gmp' && 'EA0326_PRIVATE_CONFIG_B64' || 'CMCC_PRIVATE_CONFIG_B64'] }}
          CMCC_PRIVATE_ARTIFACT_KEY: ${{ secrets[inputs.device == 'nokia_ea0326gmp' && 'EA0326_PRIVATE_ARTIFACT_KEY' || 'CMCC_PRIVATE_ARTIFACT_KEY'] }}
        run: |
          test -n "$CMCC_PRIVATE_ARTIFACT_KEY"
          python3 scripts/inject-private-config.py openwrt/files
      - name: Download sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | tee ../build-logs/download.log
      - name: Build firmware
        run: |
          cd openwrt
          make -k -j$(nproc) V=s 2>&1 | tee ../build-logs/build.log || make -k -j1 V=s 2>&1 | tee ../build-logs/build-retry.log
      - name: Collect firmware
        run: |
          python3 scripts/verify-cmcc3000.py openwrt firmware
          mkdir -p firmware
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f -exec cp {} firmware/ \;
          cp build-logs/openwrt-source.txt openwrt/cmcc3000-sources.json firmware/
      - name: Encrypt personal firmware
        if: ${{ inputs.personal_config }}
        env:
          CMCC_PRIVATE_ARTIFACT_KEY: ${{ secrets[inputs.device == 'nokia_ea0326gmp' && 'EA0326_PRIVATE_ARTIFACT_KEY' || 'CMCC_PRIVATE_ARTIFACT_KEY'] }}
          ENCRYPTED_FILENAME: ${{ steps.device.outputs.encrypted_filename }}
        run: |
          mkdir -p encrypted-firmware
          tar -czf personal-firmware.tar.gz -C firmware .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in personal-firmware.tar.gz -out "encrypted-firmware/$ENCRYPTED_FILENAME" -pass env:CMCC_PRIVATE_ARTIFACT_KEY
          cd encrypted-firmware
          sha256sum "$ENCRYPTED_FILENAME" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.personal_config }}
        with:
          name: ${{ steps.device.outputs.artifact_prefix }}-personal-encrypted-${{ github.run_id }}
          path: encrypted-firmware/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.personal_config }}
        with:
          name: ${{ steps.device.outputs.artifact_prefix }}-nand-firmware
          path: firmware/
      - name: Publish firmware
        if: ${{ !inputs.personal_config }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PREFIX: ${{ steps.device.outputs.release_prefix }}
          DEVICE_LABEL: ${{ steps.device.outputs.label }}
        run: |
          gh release create "${RELEASE_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" firmware/* --title "$DEVICE_LABEL OpenWrt with MTK WiFi" --notes 'Official OpenWrt 24.10 base with pinned padavanonly MTK WiFi and Linux 6.6 platform adaptation. NAND variant only. Preserve configuration where compatible; no automatic device flashing.' --latest=false
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.personal_config }}
        with:
          name: ${{ inputs.device || 'cmcc_rax3000m' }}-build-logs-${{ github.run_id }}
          path: |
            build-logs/
            openwrt/.config
            openwrt/build_dir/target-*/linux-mediatek_filogic/linux-6.6.*/.config
          include-hidden-files: true
